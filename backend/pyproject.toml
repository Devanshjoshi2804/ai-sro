[project]
name = "sro"
version = "0.1.0"
description = "AI-SRO — skill capture and induction from browser demonstrations"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "boto3>=1.35",
    "httpx>=0.28",
    "temporalio>=1.8",
    "playwright>=1.49",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "av>=18.1.0",
    "cryptography>=50.0.0",
    "google-genai>=2.7",
    "mcp>=2.0.0",
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "testcontainers[postgres,minio]>=4.9",
    "schemathesis>=3.38",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "types-boto3>=1.35",
    "mutmut==3.7.0",
    # The deployed vault's own client. In `dev` as well as `gcp` so the
    # adapter is covered by the ordinary suite: one that is only exercised
    # when somebody remembers an extra is one nobody finds out about until the
    # deploy it was written for.
    "google-cloud-secret-manager>=2.20",
]
# The deployed vault. Optional because the file vault is the whole story on a
# laptop and in the test suite, and because a deployment that keeps its secrets
# somewhere else should not be made to carry a client for a service it does not
# use. `pip install .[gcp]` -- or `uv sync --extra gcp` -- is the deploy step.
gcp = [
    "google-cloud-secret-manager>=2.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sro"]

[tool.uv]
package = true

# =============================================================================
# Ruff — lint + format. One tool, no black/isort/flake8 stack.
# =============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes -- every timestamp in this codebase is tz-aware
    "T20",       # no print()
    "SIM",       # simplify
    "PTH",       # pathlib over os.path
    "RUF",
    "ANN",       # every signature annotated
    "ASYNC",
    "S",         # bandit
    "TID",       # tidy imports
]
ignore = [
    "ANN401",    # typing.Any is banned by mypy config in domain/application anyway
    "B008",      # FastAPI Depends() in defaults is the framework idiom
    "N818",      # domain errors read as sentences: `raise InvariantViolation(...)`,
                 # `raise NotFound(...)`. An `Error` suffix adds a syllable and no
                 # information -- they all descend from DomainError already.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN201", "ANN001"]   # asserts and loose annotations are fine in tests
# The wire protocol's field names are the extension's own JSON keys
# (itemId, fieldLabel, testId, cssPath) -- a wire model's attribute IS the key
# pydantic matches against, so renaming it to snake_case would stop real
# payloads from parsing.
"src/sro/application/capture/rig_wire.py" = ["N815"]
# The containment/jaccard docstrings write the set-theory symbols they name --
# ∩ and ∪ -- rather than spelling them out; the arithmetic they document reads
# the same way on paper. Kept verbatim from the rig.
"src/sro/domain/observation/identity.py" = ["RUF002"]
"migrations/*" = ["ANN", "E501", "INP001"]
# A command-line tool talks on stdout. That is its interface, not a stray debug
# statement, and the token it prints must not be logged anywhere else.
"src/sro/cli/*" = ["T201"]
# Same reason, and one more: a script for holding this by hand is not shipped
# code and says where the window went on stdout.
"scripts/*" = ["T201", "INP001", "S110", "S108"]
# The measurement script counts things no repository method answers -- steps by
# which belt verified them, evidence by host -- so it asks the store in SQL. Its
# queries are module constants with one bound parameter (`MINE`); what S608 sees
# is the constant being interpolated, and there is no caller-supplied string in
# any of them.
"scripts/measure.py" = ["T201", "INP001", "S110", "S108", "S608"]
# A connector stood up by hand to prove the tool-step path. What it prints is
# how you watch the handshake happen, which is the whole point of running it.
"mock-connector/*" = ["T201", "INP001"]
# The real one, same reason: what it prints is how you watch a grant being made
# and a mail going out.
"gmail-connector/*" = ["T201", "INP001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["sro"]

# =============================================================================
# Mypy — strict everywhere. The inner layers additionally forbid Any.
# =============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The point of the domain and application layers is that they are fully typed
# and framework-free. No escape hatches.
module = ["sro.domain.*", "sro.application.*"]
disallow_any_explicit = true
disallow_any_generics = true

[[tool.mypy.overrides]]
# The one honest exception: JSON really is dynamic. Confining `Any` to this
# module means the diff can address arbitrary payloads without the escape hatch
# leaking into the rest of the application layer.
module = [
    "sro.application.induction.jsonutil",
    "sro.application.capture.decode",
    "sro.application.capture.rig_wire",
]
disallow_any_explicit = false

[[tool.mypy.overrides]]
# The Google client ships no stubs, and the adapter around it is typed against
# its own `_Secrets` protocol rather than against theirs -- so what is untyped
# here is the import itself, and nothing downstream of it.
module = ["pgvector.*", "testcontainers.*", "docker.*", "google.cloud.*", "google.api_core.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The gate covers `tests` as well as `src`, so a stale `# type: ignore` in a
# test fails the build the way a stale one in `src` does -- that is the whole
# reason this override exists. Phase 4b shipped two suppressions naming
# container factories that did not exist yet; the factories arrived, the
# suppressions went stale, and nothing could see it because `tests/` was
# outside the gate.
#
# Test code legitimately reaches into privates, hands fakes to real signatures
# and indexes untyped JSON, so full `strict` over `tests/` is 353 errors of
# noise. These eight codes are the lenient list. Removing one from it is the
# ratchet step: delete a code, fix what it surfaces, commit. Codes only ever
# cross from this list to the checked set, never back.
#
# `strict` is not a per-module option, so this names codes rather than a mode.
#
# There is deliberately no `warn_unused_ignores = false` here. It was here, and
# it made the first paragraph false: switched off, stale-ignore detection dies
# in `tests/` for *every* code, not merely the eight below -- a review planted
# stale `attr-defined`, `arg-type` and `return-value` suppressions and all
# three survived the gate. The 133 `# type: ignore[<disabled code>]` comments
# it was protecting were not worth protecting: a code on this list is already
# off, so its suppression suppresses nothing. They were deleted instead, which
# is what makes `strict`'s implied `warn_unused_ignores` survivable here.
module = ["tests.*"]
disable_error_code = [
    "attr-defined", "arg-type", "type-arg", "index", "union-attr",
    "operator", "no-any-return", "comparison-overlap",
]

# =============================================================================
# Import Linter — the dependency rule, enforced. This is the load-bearing part
# of the architecture; see docs/01-architecture.md.
# =============================================================================
[tool.mutmut]
# Chosen areas, not the whole backend. `application/skill/` is what serves the
# offer shapes, records offers and repairs drift; `domain/execution/` and the
# two execution files below decide what a run sends and whether it landed.
# The bridge that once lived in `application/skill/` (a model's reading turned
# into a Skill) was removed on 2026-09-24 with no production caller. The same
# sweep on the rig found three real defects in three rounds, including a budget
# branch that was unreachable in every test that claimed to cover it.
#
# Widening this to `src/sro/` would mutate 297 files against a 30-second suite.
# That is a different tool with a different cost; this one has to stay cheap
# enough to run while a change is still in the working tree.
source_paths = [
    "src/sro/application/skill/",
    "src/sro/domain/execution/",
    # Two files rather than the package. `application/execution/` is 7,184
    # lines and most of it is the pre-rig executor; these two are where a run
    # decides what to SEND and whether it landed, which is the same question
    # `domain/execution/` answers one layer down.
    "src/sro/application/execution/plan_step.py",
    "src/sro/application/execution/verify.py",
    # The offer side of the wire. Added 2026-09-14, the day it was found
    # serving a shape the matcher could never match: the rule here has to agree
    # with `recognise.js` exactly, and nothing but a real browser had ever
    # checked that it did.
    "src/sro/domain/skill/shape.py",
]
# The rest of the package comes verbatim: mutmut copies only what it mutates,
# and `sro.application.skill` imports half the domain. The tests are narrowed to
# match, so a sweep does not collect suites whose modules were never copied.
# `migrations` because `schema_version.MIGRATIONS` resolves from its own file
# to the backend root, and the copy's root is `mutants/`: without it a test
# asserting this repository has exactly one head fails for the copy rather than
# for any mutant, and one failure ends stats collection for the whole sweep.
# `gmail-connector` because `test_the_gather_speaks_the_connectors_language`
# loads the connector's own `server.py` by path to read the argument names it
# declares -- the contract that broke once already, when the gather asked for
# `message_id` and the connector declares `id`. Without it that test fails for
# the copy rather than for any mutant, and one failure ends stats collection
# for the whole sweep. Copied rather than deselected: a contract nothing checks
# during a sweep is a contract that can rot between sweeps.
also_copy = ["tests", "src/sro", "migrations", "gmail-connector", "scripts"]
# The whole unit suite, not just the bridge's own tests. Narrowing it to
# `tests/unit/application/skill` made every OTHER module in the package read
# 100%, because their real tests live elsewhere and never ran -- a number that
# looks like coverage and measures nothing.
pytest_add_cli_args_test_selection = [
    "tests/unit",
    # One test asserts that a real catalogue file sits under the knowledge
    # root, which is true of the repository and false of the copy mutmut runs
    # in. It fails for the copy rather than for any mutant, and a single
    # failure ends stats collection for the whole sweep.
    "--deselect",
    "tests/unit/interface/test_qa_regressions.py::TestTheKnowledgeBaseIngestPathIsReal::test_the_default_root_actually_has_the_catalogue_under_it",
]
# A changed non-Python file cannot be diffed for behaviour, and the default
# keeps every cached verdict and carries on -- which on the rig produced a
# "failed to collect stats" over a green suite. Throw the cache away instead.
on_dependency_change = "rerun"

[tool.importlinter]
root_package = "sro"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers point inward only"
type = "layers"
layers = [
    "sro.interface",
    "sro.application",
    "sro.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure — it imports nothing else in this codebase"
type = "forbidden"
source_modules = ["sro.domain"]
forbidden_modules = [
    "sro.application",
    "sro.infrastructure",
    "sro.interface",
    "sro.container",
    "sro.config",
    "fastapi",
    "sqlalchemy",
    "temporalio",
    "httpx",
    "boto3",
    "playwright",
]

[[tool.importlinter.contracts]]
name = "Application depends on abstractions, never on adapters"
type = "forbidden"
source_modules = ["sro.application"]
forbidden_modules = [
    "sro.infrastructure",
    "sro.interface",
    "sro.container",
    "fastapi",
    "sqlalchemy",
    "temporalio",
    "httpx",
    "boto3",
    "playwright",
]

[[tool.importlinter.contracts]]
name = "Infrastructure is reachable only through the composition root"
type = "forbidden"
source_modules = ["sro.interface"]
forbidden_modules = ["sro.infrastructure"]
# Indirect is allowed and is the intended path: routers reach adapters through
# sro.container, which is what a composition root is for. What this forbids is a
# router importing an adapter by name and binding itself to Postgres or Steel.
allow_indirect_imports = true

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config"
filterwarnings = [
    "error",
    # google-genai still touches typing internals Python 3.14 deprecates, and
    # it warns at import. Ours is the strict-warnings policy, so importing the
    # container -- which builds a Gemini client -- failed every test that did.
    # Narrow to the one message: a blanket ignore would hide our own.
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
    # asyncpg's transports are closed when their event loop ends and collected
    # after it, so the integration suite raised this at session teardown --
    # outside any test, which made `make check` exit non-zero over a suite that
    # had passed. About sockets being collected late, never about our code.
    "ignore::ResourceWarning",
]
markers = [
    # Needs a real Chromium with the unpacked extension loaded. Run by
    # `make test-browser` AND by `make check` (Makefile:198), which is the
    # trade being made deliberately: a machine without Chromium fails `check`
    # here, and in exchange the suite that reads the extension's own fixtures
    # runs on every full pass.
    #
    # This comment used to say the opposite -- "kept out of `make check`" --
    # and was wrong for as long as anyone can trace. It cost something. The
    # fixtures directory is globbed by two suites, `tests/browser` and
    # `tests/contract/test_observation_payloads.py`, and on 2026-09-06 one file
    # that is not a protocol payload started failing both. Only the contract
    # failure was ever looked at, because this line said the browser suite was
    # not running -- so three consecutive plans recorded "one pre-existing
    # failure, do not fix it" while a second suite failed for the same reason,
    # blaming the capture for no longer emitting a file nobody had removed.
    #
    # 86 tests, 5m23s, measured 2026-09-09.
    "browser: drives a real browser with the extension loaded",
]
