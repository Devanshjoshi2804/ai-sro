<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI-SRO</title>
    <link rel="stylesheet" href="../brand.generated.css" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <!-- What only this surface can say: it is docked beside the tab it is
         talking about. Built in strip.js, because which of its states earns
         more than one line is a rule worth testing rather than markup. The
         housekeeping -- pause, purge, settings, disconnect -- is under the
         profile there, out of the eye line of the composer. -->
    <div id="strip"></div>

    <!-- The state card the strip's chevron opens, and which four states open it
         themselves. Kept out of the strip so its own state machine stays where
         it already lives, in panel.js. -->
    <div id="expanded" hidden></div>

    <!-- Three numbers, each measured. Absent on a day with nothing in it. -->
    <div id="today"></div>

    <!-- One card per thing that is true, in the order somebody should deal with
         it. Everything here is built in panel.js from the worker's status,
         because every one of these states is a fact about this browser rather
         than a screen the operator navigated to. -->
    <!-- Everything that scrolls. The composer below it does not, so a long
         conversation never pushes the box you type in off the bottom of the
         panel -- which is the one control that must always be reachable. -->
    <div id="scroll">
    <main id="cards"></main>

    <!-- The conversation. One continuous thread per operator, across every tab
         and across the panel being closed: what they asked for, what the system
         answered, and the offers it made along the way. Built in ledger.js
         from the thread the server holds, never from markup written here -- the
         words in it are typed by an operator or written by a model. -->
    <section id="thread">
      <div id="said"></div>
      <p class="note" id="thread-note"></p>
    </section>

    <!-- What just happened, in one line. This was the foot of a "Tasks you
         keep doing here" list built from mining candidates; the list is gone
         with the rest of the older pipeline's offers, and the line it sat
         under is what `said()` has always written into. -->
    <section id="here">
      <p class="note" id="candidates-note"></p>
    </section>

    <!-- What this browser has done lately. Also a pane: as an overlay it drew
         its lines straight through whatever was behind it, and the run a line
         opens is a card that wants the width. Fetched when somebody comes
         here rather than polled -- it is a list of what already happened, and
         a request every two seconds for a screen nobody is on is a request
         nobody asked for. Built in history.js. -->
    <section id="tasks" hidden></section>

    <!-- Said when this panel outlived the extension that drew it: an update
         or a reload left it talking to nothing. Built in panel.js. -->
    <div id="stale" class="card" data-tone="attention" hidden></div>
    </div>

    <!-- Pinned. Built in ledger.js, placed here rather than after the
         messages so it stays where the hand expects it. -->
    <section id="ask-bar"></section>

    <!-- No footer. The composer above is the last thing on this surface: what
         used to sit here -- ask, purge, settings -- was either a second copy of
         the box you type in or something done once a month, and all of it was
         in the eye line of the one control reached hourly. It is under the
         profile in the strip now. -->
    <p class="note" id="purged"></p>

    <script type="module" src="panel.js"></script>
  </body>
</html>
