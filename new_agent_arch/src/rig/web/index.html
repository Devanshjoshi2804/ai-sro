<!doctype html>
<meta charset="utf-8">
<title>rig — evidence in, intents out</title>
<style>
  :root {
    --ground: #08090b; --raised: #0d0f13; --line: rgba(255,255,255,.09);
    --text: #f4f5f7; --body: #97a0ac; --muted: #6b7280; --accent: #DC582A;
    --clean: #22c55e; --refused: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--body);
    font: 14px/1.5 Inter, system-ui, sans-serif;
  }
  header {
    display: flex; gap: 24px; align-items: baseline; padding: 16px 24px;
    border-bottom: 1px solid var(--line); position: sticky; top: 0;
    background: var(--ground);
  }
  h1 { font: 600 16px Inter, system-ui, sans-serif; color: var(--text); margin: 0; }
  .spend { margin-left: auto; font-family: "JetBrains Mono", ui-monospace, monospace; }
  .spend b { color: var(--text); font-weight: 500; }
  main { padding: 16px 24px; }
  .row {
    display: grid; grid-template-columns: 90px 1fr 1fr 70px; gap: 16px;
    padding: 10px 12px; border-bottom: 1px solid var(--line); align-items: start;
  }
  .row:hover { background: var(--raised); }
  .kind {
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px;
    color: var(--accent);
  }
  .what { color: var(--text); }
  .why { color: var(--muted); font-size: 12px; }
  .history { color: var(--muted); font-size: 12px; }
  ul.past { list-style: none; padding: 0; margin: 6px 0; font-size: 12px; }
  ul.past li { display: flex; gap: 10px; align-items: baseline; }
  ul.past .when { color: var(--muted); font-family: "JetBrains Mono", ui-monospace, monospace; }
  .unread { color: var(--muted); font-style: italic; }
  /* A reading that happened, cost money and came back with nothing usable.
     It is neither unread nor read, so it must not look like either. */
  .nothing { color: var(--accent); font-style: italic; }
  .error { color: var(--refused); }
  .values {
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px;
    color: var(--body);
  }
  .cost {
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px;
    color: var(--muted); text-align: right;
  }
  .cost.unpriced { color: var(--accent); }
  select, button, input {
    background: var(--raised); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; font: inherit;
  }
  button { cursor: pointer; }
  button[disabled] { cursor: not-allowed; color: var(--muted); }
  .card {
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    margin-bottom: 12px; background: var(--raised); position: relative;
  }
  .card .cost { position: absolute; top: 12px; right: 14px; }
  .systems { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; }
  .step { display: grid; grid-template-columns: 24px 1fr; gap: 12px; padding: 6px 0 0; }
  .none { color: var(--muted); font-style: italic; }
  .runner { margin-top: 10px; }
  .runner form {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0;
  }
  .runner label { display: inline-flex; gap: 6px; align-items: center; color: var(--body); }
  .runner input[type="checkbox"] { padding: 0; }
  .runner h4 {
    color: var(--text); font: 600 13px Inter, system-ui, sans-serif; margin: 14px 0 6px;
  }
  .runner pre {
    background: var(--ground); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 8px;
  }
  .outcome { color: var(--text); padding: 6px 0; }
  .ran { padding: 5px 0; border-top: 1px solid var(--line); }
  .ran.held { color: var(--clean); }
  .ran.failed, .ran.refused { color: var(--refused); }
  .ran.withheld { color: var(--accent); }
  .spent { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; }
  .spent.unpriced { color: var(--accent); }
</style>

<header>
  <h1>rig</h1>
  <select id="stream"></select>
  <button id="view">workflows &rarr;</button>
  <div class="spend" id="spend"></div>
</header>
<main id="rows"></main>
<main id="jobs" hidden></main>

<script>
  // Out of the URL once, then out of the URL for good. `?token=...` in the
  // address bar is the rig's credential written into browser history, into
  // every screenshot of this window, and into the referrer of anything this
  // page loads. Take it on arrival -- that is how the operator gets here --
  // wipe the address bar, and hold it for the rest of the tab in
  // sessionStorage, which a reload survives and another tab cannot read.
  //
  // The fallback is `config.py`'s own default ingest token, so a rig left at
  // its defaults is reachable with no token anywhere: absent means "assume the
  // default", not "send nothing and draw an empty page". A rig with a real
  // token answers 401 and the console says so rather than going blank.
  const TOKEN_KEY = "rig.token";

  function readToken() {
    const here = new URL(location.href);
    const given = here.searchParams.get("token");
    if (given) {
      sessionStorage.setItem(TOKEN_KEY, given);
      here.searchParams.delete("token");
      history.replaceState(null, "", here.pathname + here.search + here.hash);
    }
    return sessionStorage.getItem(TOKEN_KEY) || "dev-only-not-a-secret";
  }

  const head = { headers: { Authorization: "Bearer " + readToken() } };

  async function get(path) {
    const response = await fetch(path, head);
    if (!response.ok) throw new Error(path + " " + response.status);
    return response.json();
  }

  // Everything drawn here is either captured page content or a model's words
  // about it. A WMS field labelled `<img src=x onerror=...>` would otherwise
  // run in this page: capture -> trim -> model -> innerHTML. Escape at the
  // boundary rather than trusting the far end of that chain.
  function esc(value) {
    return String(value ?? "").replace(
      /[&<>"']/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
    );
  }

  // Three states, not two. `intent` is present for every gesture a reading
  // was made for, whatever came back; `intent.act` null with no error means
  // the model answered, was billed, and said nothing usable. Rendering that as
  // "not read yet" is the console telling the operator a lie it was paid for.
  function line(g) {
    const intent = g.intent;
    const what = intent?.error
      ? `<span class="error">unread — ${esc(intent.error)}</span>`
      : intent?.act
        ? `<span class="what">${esc(intent.act)}</span><div class="why">${esc(intent.why)}</div>`
        : intent
          ? `<span class="nothing">read, nothing usable</span>${
              intent.why ? `<div class="why">${esc(intent.why)}</div>` : ""
            }`
          : `<span class="unread">not read yet</span>`;
    const values = (intent?.values_seen ?? [])
      .map((v) => `${esc(v.field)}=${esc(v.value)}`)
      .join("  ");
    // `intent?.cost_usd ? …` drew an unpriced or a $0.00 reading with an empty
    // cell — identical to a gesture nobody has read. `unpriced` exists exactly
    // because a $0.00 row and an honestly-unpriced row cannot be told apart by
    // cost_usd alone, and this is the one place a human reads it.
    const cost = !intent
      ? ""
      : intent.unpriced
        ? "unpriced"
        : "$" + Number(intent.cost_usd ?? 0).toFixed(5);
    return `<div class="row">
      <div class="kind">${esc(g.kind)}${g.calls ? " ·" + g.calls : ""}</div>
      <div>${what}</div>
      <div class="values">${values}</div>
      <div class="cost${intent?.unpriced ? " unpriced" : ""}">${esc(cost)}</div>
    </div>`;
  }

  // A pure function so it can be run against hostile and awkward input the way
  // line() is, rather than only ever existing inside a fetch.
  function spendLine(s) {
    const readings = s.gestures_read;
    return `<b>${esc(readings)}</b>/${esc(s.gestures)} read ·
       <b>$${Number(s.cost_usd ?? 0).toFixed(4)}</b> ·
       $${Number(s.per_gesture_usd ?? 0).toFixed(6)} a reading${
         s.unusable ? ` · <b class="nothing">${esc(s.unusable)}</b> unusable` : ""
       }${s.unpriced ? ` · <b class="nothing">${esc(s.unpriced)}</b> unpriced` : ""}${
         // Billed at the output rate, inside out_tokens, and on Flash about
         // 84% of it. Shown here because this line is the one place a person
         // reads the bill, and without it the bill says the readings were
         // expensive without saying that most of what was paid for was
         // reasoning nobody ever read.
         s.thought_tokens ? ` · <b>${esc(s.thought_tokens)}</b> thought` : ""
       }${
         s.passes ? ` · <b>$${Number(s.mining_usd ?? 0).toFixed(4)}</b> mining over ${esc(s.passes)}${
           // The sibling of `unpriced` one field over, and dropped here for a
           // round: a pass on a model missing from PRICES drew "$0.0000 mining
           // over 1", which is the $0.00-versus-honestly-unpriced confusion the
           // flag was added to prevent -- in the one place a human reads the
           // bill. It happened for real: findings.md records mining_usd 0.0 and
           // mining_unpriced 1 while $1.12 was billed.
           s.mining_unpriced ? ` · <b class="nothing">${esc(s.mining_unpriced)}</b> unpriced` : ""
         }` : ""
       }`;
  }

  // A workflow's title, narrative and every step's words are model output over
  // captured page content -- the same chain as an intent's `why`, and the same
  // escaping. `system` is derived at ingest and `cites` are ids, and they go
  // through esc() too: a field that is safe today is a field nobody checked
  // the day its source changed.
  function step(s) {
    return `<div class="step">
      <div class="kind">${esc(s.order)}</div>
      <div>
        <div class="what">${esc(s.says)}</div>
        <div class="why">${s.system ? esc(s.system) : "system unknown"} ·
          ${esc((s.cites ?? []).length)} cited</div>
      </div>
    </div>`;
  }

  // What has become of a job, in one line. "never run" until it has; then how
  // many times, how many held, how the last one ended and who started it; and
  // "writes unasked" once three live runs have verified every write by state.
  function became(runs) {
    if (!runs || !runs.total) {
      const seen = Object.values(runs?.offers ?? {}).reduce((a, b) => a + b, 0);
      return seen ? `never run · offered ${seen} time${seen === 1 ? "" : "s"}` : "never run";
    }
    const last = runs.last
      ? ` · last ${runs.last.outcome}${runs.last.live ? "" : " (dry)"} by ${runs.last.started_by}`
      : "";
    const earned = runs.earned ? " · writes unasked" : "";
    // A step the last run found only by a weak locator is a page moving
    // under the job; said before the job breaks, not after.
    const stale = runs.stale
      ? ` · ${runs.stale} step${runs.stale === 1 ? "" : "s"} matched weakly`
      : "";
    // The offers the browser made for this job, by what became of them; only
    // the fates that happened, and nothing when none has.
    const fates = Object.entries(runs.offers ?? {})
      .filter(([, n]) => n > 0)
      .map(([fate, n]) => `${n} ${fate.replace("_", " ")}`)
      .join(", ");
    const offered = fates ? ` · offers: ${fates}` : "";
    return `${runs.total} run${runs.total === 1 ? "" : "s"} · ${runs.held} held${last}${earned}${stale}${offered}`;
  }

  function job(w) {
    // The pass, not a price. One call proposes every job in a pass, so a
    // per-job dollar figure was the whole pass's bill drawn once per card.
    return `<div class="card">
      <div class="cost">${esc(w.pass_id)}</div>
      <div class="what">${esc(w.title)}</div>
      <div class="why">${esc(w.narrative)}</div>
      <div class="systems">${(w.systems ?? []).map(esc).join("  ")}</div>
      <div class="history">${esc(became(w.runs))}</div>
      ${(w.steps ?? []).map(step).join("")}
      <button class="run" data-id="${esc(w.id)}">run</button>
      <button class="past" data-id="${esc(w.id)}">past runs</button>
      <div class="runner" id="runner-${esc(w.id)}"></div>
    </div>`;
  }

  // What a step cost, or that nobody could price it. The same three states as
  // a reading's cost cell: a step billed on a model missing from PRICES drawn
  // as "$0.0000" is a bill this page invented.
  function money(thing) {
    return thing?.unpriced ? "unpriced" : "$" + Number(thing?.cost_usd ?? 0).toFixed(4);
  }

  // A run's step is a model's plan over a page the extension read back. Same
  // chain as an intent's `why`, so the same esc() on every field of it --
  // `says` and `reason` came from the model, `matched_by` from the page.
  function ranStep(s) {
    return `<div class="ran ${esc(s.verdict)}">
      <span class="kind">${esc(s.order)}</span> ${esc(s.says)} ·
      <b>${esc(s.verdict)}</b>${s.verdict_by ? " by " + esc(s.verdict_by) : ""}${
        s.matched_by ? " · matched " + esc(s.matched_by) : ""
      }${s.stale ? " · <i>stale</i>" : ""}${
        s.approved_at ? " · approved " + esc(s.approved_at) : ""
      } ·
      <span class="spent${s.unpriced ? " unpriced" : ""}">${esc(money(s))}</span>
      ${s.reason ? `<div class="why">${esc(s.reason)}</div>` : ""}
    </div>`;
  }

  // In full, which is more than the recorded call. A withheld write always
  // carries the command the planner produced; `method`/`url`/`body` are there
  // only when the step had a call recorded against it, so printing those alone
  // draws an empty box for the writes that have no recording behind them.
  function withheldWrites(run) {
    const writes = run.withheld ?? [];
    if (!writes.length) return "";
    return `<h4>what a live run would have sent</h4>` + writes
      .map((w) => `<pre>step ${esc(w.step)}\n${esc(w.method ?? "")} ${esc(w.url ?? "")}\n${
        esc(w.body ?? "")}\n${esc(JSON.stringify(w.planned ?? {}, null, 2))}</pre>`)
      .join("");
  }

  function runView(run) {
    return `<div class="outcome">${esc(run.outcome)} ·
      <span class="spent${run.unpriced ? " unpriced" : ""}">${esc(money(run))}</span>
      ${
        run.outcome === "running"
          ? `<button class="stop">stop</button>`
          : `<button class="close">close</button>`
      }</div>
      ${(run.steps ?? []).map(ranStep).join("")}${withheldWrites(run)}`;
  }

  // `get`'s sibling: the same bearer, and the same refusal to swallow a
  // non-2xx. The runner's doors refuse for reasons a person can act on -- the
  // browser is busy, the browser is gone, a declared value is blank -- and
  // every one of them arrives as `detail`.
  async function post(path, body) {
    const response = await fetch(path, {
      method: "POST",
      headers: { ...head.headers, "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const said = await response.json().catch(() => ({}));
    if (!response.ok) {
      const detail = said.detail ?? path + " " + response.status;
      throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
    }
    return said;
  }

  const K_GIVE_UP_AFTER = 5;

  // Poll while it runs, and only while it runs: the other five OUTCOMES are
  // terminal, so a poll after one of them asks a question that can never come
  // back different.
  async function watch(runId, device, into, failures = 0) {
    let run;
    try {
      run = await get(`/v1/runs/${encodeURIComponent(runId)}`);
    } catch (error) {
      // A poll that failed is not a run that stopped -- the run is in the
      // operator's browser, and this is the page that watches it. Say so and
      // ask again; give up only after five in a row, and say that too rather
      // than sitting on a view that has quietly stopped being current.
      // textContent, not esc(): the message carries a route's `detail`, and
      // the DOM does the escaping itself when it is never parsed as markup.
      const done = failures + 1 >= K_GIVE_UP_AFTER;
      const say = into.querySelector(".error") ?? into.appendChild(document.createElement("div"));
      say.className = "error";
      say.textContent = done
        ? `${error.message} — gave up watching after ${K_GIVE_UP_AFTER} tries`
        : error.message;
      if (!done) setTimeout(() => watch(runId, device, into, failures + 1), 1000);
      return;
    }
    into.innerHTML = runView(run);
    into.querySelector(".stop")?.addEventListener("click", (event) => {
      event.target.disabled = true;
      post(`/v1/runs/${encodeURIComponent(runId)}/abort`, { device_id: device }).catch(
        // The next poll replaces `.outcome` a second later, so it is gone as
        // often as it is there.
        (error) =>
          into
            .querySelector(".outcome")
            ?.insertAdjacentHTML("beforeend", `<span class="error">${esc(error.message)}</span>`),
      );
    });
    // Terminal outcomes leave the view on the page until the operator closes
    // it: what a dry run would have sent is the whole point of a dry run, and
    // it is worth nothing if the next redraw eats it.
    into.querySelector(".close")?.addEventListener("click", () => {
      into.innerHTML = "";
    });
    if (run.outcome === "running") setTimeout(() => watch(runId, device, into), 1000);
  }

  // Prefilled with the last value the recording actually carried, and
  // `required`: POST /v1/runs refuses a declared parameter left blank rather
  // than performing the job with somebody else's client code, and the field
  // saying so beats a round trip to hear it.
  //
  // The prefill is a value read off a warehouse page, and it lands inside an
  // attribute rather than between tags: `" onmouseover=...` closes `value="`
  // and everything after it is markup. esc() covers both contexts because it
  // escapes the quotes too -- which is exactly the property a test has to
  // hold it to, since dropping `"` from esc() breaks nothing anywhere else.
  function paramField(p) {
    const seen = (p.seen_values ?? []).slice(-1)[0] ?? "";
    return `<label>${esc(p.name)}
      <input name="${esc(p.name)}" value="${esc(seen)}" required></label>`;
  }

  async function openRunner(w) {
    const { devices } = await get("/v1/devices");
    const fields = (w.parameters ?? []).map(paramField).join("");
    const picker = devices.length
      ? `<select name="device">${devices.map((d) => `<option>${esc(d)}</option>`).join("")}</select>`
      : `<span class="none">no browser is connected to the rig</span>`;
    const box = document.getElementById(`runner-${w.id}`);
    // Dry unless a person ticks it. The first press of a mined job is a run
    // that reads everything and sends nothing.
    box.innerHTML = `<form class="start">${fields}${picker}
      <label><input type="checkbox" name="live"> live — send the writes</label>
      <button ${devices.length ? "" : "disabled"}>start</button></form>
      <div class="note"></div><div class="live"></div>`;
    box.querySelector("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = new FormData(event.target);
      const values = {};
      // Trimmed: a client code with a copied-in trailing space is typed into
      // somebody's form as a client code with a trailing space.
      for (const p of w.parameters ?? []) values[p.name] = (form.get(p.name) ?? "").trim();
      const note = box.querySelector(".note");
      // `required` stops an empty field and not a field of three spaces, and
      // the route counts " " as a value given. Same refusal, same words.
      const blank = Object.keys(values).filter((name) => !values[name]);
      note.innerHTML = blank.length
        ? `<div class="error">this job needs a value for: ${esc(blank.join(", "))}</div>`
        : "";
      if (blank.length) return;
      try {
        const { run_id } = await post("/v1/runs", {
          workflow_id: w.id,
          values,
          live: form.get("live") === "on",
          device_id: form.get("device"),
          allow_focus: true,
          started_by: "form",
        });
        watch(run_id, form.get("device"), box.querySelector(".live"));
      } catch (error) {
        note.innerHTML = `<div class="error">${esc(error.message)}</div>`;
      }
    });
  }

  // The job's recent runs, one line each, newest first; "open" draws the run
  // the way a live one is drawn, and it closes the same way.
  function pastList(runs) {
    if (!runs.length) return `<div class="none">no runs yet</div>`;
    return `<ul class="past">${runs
      .map(
        (r) => `<li><span class="when">${esc(r.started_at)}</span>
          <span class="outcome">${esc(r.outcome)}${r.live ? "" : " (dry)"}</span>
          <span class="by">by ${esc(r.started_by)}</span>
          <button class="open" data-run="${esc(r.id)}">open</button></li>`,
      )
      .join("")}</ul>`;
  }

  async function openPast(w) {
    const box = document.getElementById(`runner-${w.id}`);
    box.innerHTML = `<div class="note"></div><div class="live"></div>`;
    const note = box.querySelector(".note");
    try {
      const { runs } = await get(`/v1/runs?workflow_id=${encodeURIComponent(w.id)}&limit=10`);
      note.innerHTML = pastList(runs);
    } catch (error) {
      note.innerHTML = `<div class="error">${esc(error.message)}</div>`;
      return;
    }
    for (const b of note.querySelectorAll("button.open")) {
      b.addEventListener("click", async () => {
        const into = box.querySelector(".live");
        try {
          const run = await get(`/v1/runs/${encodeURIComponent(b.dataset.run)}`);
          into.innerHTML = runView(run);
          into.querySelector(".close")?.addEventListener("click", () => {
            into.innerHTML = "";
          });
          // A run still running is watched from here on, like one just started.
          if (run.outcome === "running") watch(run.id, run.device_id, into);
        } catch (error) {
          into.innerHTML = `<div class="error">${esc(error.message)}</div>`;
        }
      });
    }
  }

  // `#run-<id>` in the address opens that run under its job: the extension's
  // "Details on the rig" points here, and a link somebody pasted should land
  // on the run and not on the front page. Pure, so it can be tested.
  function runHash(hash) {
    const found = /^#run-([A-Za-z0-9_]+)$/.exec(hash || "");
    return found ? found[1] : null;
  }

  let showing = "gestures";

  // The three-second redraw replaces every card, and with it every runner box
  // -- a half-typed form, the div a poll is writing into, the finished view a
  // dry run left behind. Move the live nodes into the fresh cards rather than
  // re-render them: re-rendering is exactly what loses the typed values and
  // detaches the node the poll chain still holds a reference to.
  //
  // Holding the redraw off instead was the first attempt and it deadlocked --
  // the redraw being skipped is the one that would have cleared the condition.
  function carryOver(from, into) {
    for (const box of from.querySelectorAll(".runner")) {
      // An empty box is a card nobody opened; the fresh one is identical.
      if (!box.innerHTML) continue;
      // A workflow the fresh list no longer names has no card to move into,
      // so its box is dropped with the rest of the old markup. A poll still
      // running against it then writes to a detached node until the run ends,
      // which is what "the job it was started from is gone" leaves to draw.
      into.querySelector(`#${CSS.escape(box.id)}`)?.replaceWith(box);
    }
  }

  async function drawJobs() {
    const { workflows } = await get("/v1/workflows");
    const jobs = document.getElementById("jobs");
    const fresh = document.createElement("div");
    fresh.innerHTML = workflows.length
      ? workflows.map(job).join("")
      : `<div class="none">nothing mined yet — POST /v1/mine</div>`;
    carryOver(jobs, fresh);
    jobs.replaceChildren(...fresh.childNodes);
    for (const b of jobs.querySelectorAll("button.run")) {
      b.addEventListener("click", () =>
        openRunner(workflows.find((w) => w.id === b.dataset.id)));
    }
    for (const b of jobs.querySelectorAll("button.past")) {
      b.addEventListener("click", () =>
        openPast(workflows.find((w) => w.id === b.dataset.id)));
    }
  }

  async function draw() {
    document.getElementById("spend").innerHTML = spendLine(await get("/v1/spend"));
    if (showing === "workflows") return drawJobs();

    const picker = document.getElementById("stream");
    const { streams } = await get("/v1/streams");
    const shown = [...picker.options].map((o) => o.value).join("\u0000");
    const wanted = streams.map((s) => s.stream_id).join("\u0000");
    if (shown !== wanted) {
      picker.innerHTML = streams
        .map((s) => `<option value="${esc(s.stream_id)}">${esc(s.stream_id)} (${s.gestures})</option>`)
        .join("");
    }

    const chosen = picker.value || streams[0]?.stream_id;
    if (!chosen) return;
    const { gestures } = await get("/v1/gestures?stream=" + encodeURIComponent(chosen));
    document.getElementById("rows").innerHTML = gestures.map(line).join("");
  }

  document.getElementById("stream").addEventListener("change", draw);
  document.getElementById("view").addEventListener("click", (event) => {
    showing = showing === "gestures" ? "workflows" : "gestures";
    event.target.innerHTML = showing === "gestures" ? "workflows &rarr;" : "&larr; gestures";
    document.getElementById("rows").hidden = showing !== "gestures";
    document.getElementById("jobs").hidden = showing !== "workflows";
    document.getElementById("stream").hidden = showing !== "gestures";
    draw();
  });
  async function openRun(runId) {
    if (showing !== "workflows") document.getElementById("view").click();
    await drawJobs();
    let run;
    try {
      run = await get(`/v1/runs/${encodeURIComponent(runId)}`);
    } catch (error) {
      document.getElementById("spend").insertAdjacentHTML(
        "beforeend",
        `<div class="error">${esc(error.message)}</div>`,
      );
      return;
    }
    const box = document.getElementById(`runner-${run.workflow_id}`);
    if (!box) return;
    box.innerHTML = `<div class="note"></div><div class="live"></div>`;
    const into = box.querySelector(".live");
    into.innerHTML = runView(run);
    into.querySelector(".close")?.addEventListener("click", () => {
      into.innerHTML = "";
    });
    if (run.outcome === "running") watch(run.id, run.device_id, into);
    box.scrollIntoView?.({ block: "start" });
  }

  window.addEventListener("hashchange", () => {
    const wanted = runHash(location.hash);
    if (wanted) void openRun(wanted);
  });

  // `finally`, not `then`: a first paint that could not reach the rig must
  // not also drop the run the address asked for.
  draw().finally(() => {
    const wanted = runHash(location.hash);
    if (wanted) void openRun(wanted);
  });
  setInterval(draw, 3000);
</script>
