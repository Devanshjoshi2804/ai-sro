[project]
name = "rig"
version = "0.1.0"
description = "Model-first workflow mining rig. Standalone; see docs/new-agent-doc-arc."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "google-genai>=2.7",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    # The bake-off asks Anthropic beside Gemini. A dev dependency, not a
    # runtime one: the rig serves, mines and runs with no Anthropic key and
    # no SDK installed, and only `make bakeoff` needs either.
    "anthropic>=0.40",
    # Pinned exactly: a mutation score is only comparable to the baseline it is
    # measured against, and a new version that generates different mutants
    # moves the number for reasons that have nothing to do with the tests.
    "mutmut==3.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
filterwarnings = [
    # google-genai still touches typing internals Python 3.17 removes, and it
    # warns at import. Narrow to the one message and module: a blanket ignore
    # would hide our own warnings too.
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google.genai.types",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.mutmut]
# The sweeps that found most of this project's real defects were guard
# deletions run by hand: comment a line out, see whether anything fails. This
# is that, 2,383 times, in six and a half minutes.
source_paths = ["src/rig/"]
tests_dir = ["tests/"]
# mutmut copies the tree into `mutants/` and runs there, so anything the suite
# opens by path has to come too. The corpus fixture is the one file the tests
# read that is not Python -- and the page, which one test reads a line out of.
also_copy = ["tests", "src/rig/web"]
# A changed non-Python file cannot be diffed for behaviour, so the default
# ("warn") keeps every cached verdict and carries on. That is worse than it
# sounds: `src/rig/web/index.html` changed, the stale copy under `mutants/` no
# longer matched the test that reads a line out of it, and the sweep died
# during stats collection with `failed to collect stats. runner returned 1`
# over a suite that is green. A false alarm shaped exactly like a broken suite
# costs whoever meets it an hour. "rerun" throws the cache away instead, which
# is the honest answer when the thing under test may have moved.
on_dependency_change = "rerun"
